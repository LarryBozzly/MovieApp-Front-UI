syntax = "proto3";

package ws;

// ------------------------------
// Common Messages
// ------------------------------

message Error {
  string message = 1;
}

message Identify {
  string userId = 1;
}

// ------------------------------
// Notification Flow
// ------------------------------

enum NotificationType {
  INVITATION = 0;
}

message Notification {
  uint32 id = 1;
  NotificationType type = 2;
  string message = 3;
}

message GetNotificationsRequest {
  // Client → Server: Request all notifications
}

message GetNotificationsResponse {
  // Server → Client: Return all notifications for the user
  repeated Notification notifications = 1;
}

message ReadNotificationRequest {
  // Client → Server: Mark a notification as read
  uint32 notificationId = 1;
}

message ReadNotificationResponse {
  // Server → Client: Confirmation that notification was marked as read
  uint32 notificationId = 1;
  bool success = 2;
}

// ------------------------------
// Invitation Flow
// ------------------------------

message InvitationRequest {
  // Client → Server: Send an invite
  string to = 1;
  repeated uint32 genreIds = 2;
}

message InvitationResponse {
  // Recipient → Server: Accept the invite
  uint32 notificationId = 1;
  bool accepted = 2;
}

// ------------------------------
// Movie Matching Flow
// ------------------------------

message Movie {
  bool adult = 1;
  string backdrop_path = 2;
  repeated uint32 genre_ids = 3;
  uint32 id = 4;
  string original_language = 5;
  string original_title = 6;
  string overview = 7;
  double popularity = 8;
  string poster_path = 9;
  string release_date = 10;
  string title = 11;
  bool video = 12;
  double vote_average = 13;
  uint32 vote_count = 14;
  uint32 percentage_popularity = 15;
}

message MovieSelection {
  // Client → Server & Server → Client: Used for LIKES
  Movie movie = 1;
}

message MovieRejection {
  // Client → Server: Used for DISLIKES/REJECTIONS
  Movie movie = 1;
}

message NoMovieSelected {}

message StartMovieMatch {
  // Server → Both users: Start movie selection
  repeated Movie movies = 1;
}

message MovieMatch {
  // Server → Both users: A match on a movie both liked
  Movie movie = 1;
  bool solo = 2;
}

message WatchlistMoviesUpdate {
  repeated uint32 mediaIds = 1;
}

// ------------------------------
// Top-Level Envelopes
// ------------------------------

message ClientMessage {
  oneof payload {
    Identify identify = 1;
    InvitationRequest invitationRequest = 2;
    InvitationResponse invitationResponse = 3;
    MovieSelection movieSelection = 4;
    MovieRejection movieRejection = 5;
    NoMovieSelected noMovieSelected = 6;
    GetNotificationsRequest getNotificationsRequest = 7;
    ReadNotificationRequest readNotificationRequest = 8;
  }
}

message ServerMessage {
  oneof payload {
    Error error = 1;
    StartMovieMatch startMovieMatch = 2;
    MovieSelection movieSelection = 3;
    NoMovieSelected noMovieSelected = 4;
    MovieMatch movieMatch = 5;
    WatchlistMoviesUpdate watchlistMoviesUpdate = 6;
    GetNotificationsResponse getNotificationsResponse = 7;
    ReadNotificationResponse readNotificationResponse = 8;
  }
}